# Runs PostgreSQL + the API with one command:  docker compose up --build
# Settings come from the .env file next to this one (copy .env.example).
# The client still runs with `npm run dev` in client/ (see README).

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: the database is only reachable by the api service on the
    # compose network, never from outside Docker.

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "4000:4000"

volumes:
  db-data:
